# CHANGELOG.yaml – the single source of truth for the project changelog.
# Two consumers render from this one file, so there is no second place to edit:
#   * packaging/changelog-gen.sh -> the Debian-format changelog cargo-deb ships
#     (see crates/cradle/Cargo.toml [package.metadata.deb] changelog)
#   * packaging/release-notes.sh -> the GitHub release body (nightly.yaml uses
#     the top entry; release.yaml uses the entry matching the v<X.Y.Z> tag)
# The note bodies below are written in Markdown (### headings, * bullets) so
# they render directly on the GitHub Releases page.
# Keep newest entry first.
# All timestamps must be in full ISO-8601 format.
# Fields "distribution" and "urgency" are optional per-entry; if you omit them,
# changelog-gen.sh defaults to distribution "unstable" and urgency "medium".

- semver: 1.1.1
  date: 2026-08-28T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### EVPN multihoming over MPLS
        * ESI label split horizon (RFC 7432 §8.3): over MPLS no outer
          source identifies the ingress PE, so a CE's BUM entering the
          non-DF used to come back to it through the DF. Each PE now
          owns an ESI label per segment; a peer PE pushes it under the
          EVI label on BUM that entered the segment through it
          (`mpls_l2_esi_push`), and the receiver pops it into the
          segment's `es_bits` (`ESI_LABEL`, `mpls_l2_esi_pop`) — the
          same flood-loop gate the VXLAN local bias and SRv6 outer
          source already drive
        * `SLOT_ES` steers the labelled replication slot only toward
          peers of the segment, while the peer's plain slot skips it;
          `flood()` picks the copy from the ingress port's `PORT_ES`

    - note: |
        ### LAG ports
        * Bond membership is tracked live: the link monitor parses
          `master` changes and reconciles the `PORT_MASTER` aliases
          from sysfs, so a member enslaved, released or replaced by a
          new device after attach is recognised by the XDP stage
          without a re-`SetPort`

    - note: |
        ### Control plane and configuration
        * `SetEthernetSegment.esi_label`; `AddReplSlot {esi, esi_label}`
          for a per-(peer, segment) slot, keyed apart from the plain
          slot
        * Static config `ethernet_segments[].esi_label` and
          `repl_slots[].esi` / `.esi_label`
        * `cradle dump l2` prints the `es`, `mpls` and `static` FDB
          flags — an `FDB_F_ESNHG` entry was indistinguishable from a
          plain remote

    - note: |
        ### BDD / test infrastructure
        * EVPN multihoming over SRv6: `cradle_evpn_mh_srv6` (static)
          and `cradle_evpn_mh_srv6_zebra` (BGP-driven over IS-IS/SRv6)
          — split horizon on the End.DT2M outer source, the non-DF
          filter, aliasing over a {pe2, pe3} End.DT2U group, and DF
          re-election on withdrawal
        * EVPN multihoming over MPLS: `cradle_evpn_mh_mpls` (static)
          and `cradle_evpn_mh_mpls_zebra` (BGP-driven over IS-IS
          SR-MPLS with a P-transit LSR) — ESI labels allocated and teed
          by zebra-rs, the DF withholding the non-DF's echo, a segment
          deleted and re-added through BGP drawing a fresh label
        * `cradle_evpn_mh_lag` rebuilds a bond member with a new ifindex
          and proves unicast encapsulation resumes; new steps `I record
          the cradle stat …` / `… should exceed its recorded value`

- semver: 1.1.0
  date: 2026-08-28T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### EVPN multihoming
        * RFC 7432 multihoming lands in the cradle dataplane: a CE
          dual-homed to two PEs over one Ethernet Segment, with the
          non-DF filter, split horizon, aliasing, mass withdraw, LAG
          ports and single-active redundancy — every piece the kernel
          bridge has no primitive for, driven by zebra-rs over gRPC
          and proven end to end in BDD

    - note: |
        ### Designated Forwarder and split horizon
        * Non-DF filter (RFC 7432 §8.5): the `ES_DF` gate in the flood
          loop — a segment port whose DF in the bridge domain is another
          PE delivers no BUM to the CE; `l2_drop_nondf` counts it
        * Split-horizon / local-bias filter (RFC 8365 §8.3.1): the VXLAN
          v4/v6 and SRv6 DT2U decaps resolve the outer source VTEP to
          the bitmap of segments it shares with us (`VTEP_ES`), and the
          flood skips the segment's local ports (`PORT_ES`,
          `l2_drop_sph`) so a peer's copy never echoes back to the CE

    - note: |
        ### Aliasing and mass withdraw
        * Ethernet Segment nexthop groups (RFC 7432 §8.4, §8.2): an FDB
          entry may name a segment instead of a VTEP (`FDB_F_ESNHG`);
          known unicast is spread over the group's members by
          `l2_flow_hash`, and a PE leaving the segment moves every MAC
          behind it with one group update, no per-MAC churn
        * Control-plane local entries (`FDB_F_STATIC`) — a peer's MAC on
          a shared segment reached over our own port, never aged or
          reported

    - note: |
        ### LAG ports
        * A kernel bond (802.3ad / MC-LAG to the CE) is a port: `PORT_MASTER`
          maps bond members to their bond, so every XDP-stage port
          decision on a native-XDP member resolves to the bond that TC
          sees; `SetPort` reads the membership from sysfs
        * Reserved group addresses `01:80:c2:00:00:0x` (LACP, STP, LLDP)
          are punted to the host — never learned, tunneled or flooded

    - note: |
        ### Single-active redundancy
        * RFC 7432 §14.1.1: a single-active non-DF's segment port is a
          standby that blocks both directions (`ES_DF_F_BLOCK`,
          `l2_drop_sa`), stronger than the all-active BUM-only filter
        * Single-active nexthop groups are ordered, not hashed: slot 0
          (the DF) forwards and the rest is a pre-installed backup path;
          zebra-rs promotes the backup the moment the DF's per-ES A-D is
          withdrawn, before any per-MAC route moves

    - note: |
        ### Control plane and configuration
        * New gRPC verbs: `SetEthernetSegment` / `DelEthernetSegment`,
          `SetEsRole {df, single_active}`, `SetEsPeers`, `SetEsNhg`,
          `AddFdbLocal`; `FdbRemote` carries the ESI
        * Static config `ethernet_segments[]` (ports, peers, roles, nhg)
          and `fdb[]` (esi, port) for serve and `ctl apply`; `ctl apply`
          gains the `fdb` section
        * `CradleXdpMeta` grows to 16 bytes to carry the shared-segment
          bitmap across the decap

    - note: |
        ### BDD / test infrastructure
        * Static-config features for every slice — `cradle_evpn_mh_df`,
          `_sph`, `_nhg`, `_lag`, `_sa` — each with a negative control
          that makes the duplicates, echoes or drops appear
        * BGP-driven twins `cradle_evpn_mh_df_zebra` and
          `cradle_evpn_mh_sa_zebra`: Type-4 DF election, split horizon
          via the peers tee, aliasing over the {pe2, pe3} group, real
          LACP through cradle, and failover when the DF's zebra dies
        * CI: pin bpf-linker to 0.10.3 (0.11 defaults to system LLVM)

- semver: 1.0.0
  date: 2026-08-01T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### 1.0 milestone
        * First stable release line: an eBPF L2–L7 data plane
          driven by zebra-rs, with EVPN (VXLAN and MPLS), E-Line,
          SRv6, MPLS/TI-LFA, L3VPN, GTP-U/MUP, CNI and policy all
          proven end to end in BDD

    - note: |
        ### IPv6 underlay
        * IPv6-underlay VXLAN: native v6 VTEPs for L2
          known-unicast, BUM and E-Line
        * EVPN over MPLS toward IPv6 PEs — service-label
          resolution through the v6 FIB
        * v6-underlay zebra-driven EVPN and VPWS BDD coverage,
          including a P-transit topology; SRv6 VPWS encapsulation
          fix

    - note: |
        ### Mobile User Plane (GTP-U / MUP)
        * IPv6-outer GTP-U: GTP6.E encapsulation and H.M.GTP6.D
          decapsulation
        * The decap PDR match is scoped by the ingress port's
          VRF, so overlapping F-TEIDs in different network
          instances stay separate
        * Faithful UPF lab shapes in BDD: the N3 port inside a
          kernel VRF, and a GTP-gateway shape where
          lookup-network-instance names the N3 context
        * The experimental GTP↔SRv6 stitch is dropped in both
          directions

    - note: |
        ### eBPF data plane
        * Fix a verifier stack overflow in the main program
        * Decap metadata VRF takes precedence over the ingress
          port's VRF binding; v6 output-interface tolerance in
          FIB resolution

    - note: |
        ### BDD / test infrastructure
        * The cucumber runner defaults to 16-way feature
          concurrency (pass --concurrency=1 for a serial run)
        * The sudo wrapper of a paused zebra-rs is reaped at
          teardown, so failover features no longer leave a
          stopped sudo + zombie pair behind

- semver: 0.9.9
  date: 2026-07-31T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### E-Line (EVPN-VPWS)
        * E-Line point-to-point services over VXLAN (RFC 8365 §6)
          and over MPLS (RFC 8214 / RFC 7432) in the eBPF data
          plane
        * Both encapsulations proven end to end in BDD with
          BGP-driven signaling from zebra-rs — no static state

    - note: |
        ### EVPN over MPLS
        * Known-unicast EVPN forwarding over MPLS (RFC 7432) in
          the eBPF data plane
        * BUM traffic over MPLS via a sentinel tunnel with
          multi-PE ingress replication
        * BGP-driven three-node BDD coverage with zero static
          configuration

    - note: |
        ### Control plane
        * WatchFdb learn events now report the learning port, so
          subscribers see which port a MAC was learned on

    - note: |
        ### Mobile User Plane (GTP-U / MUP)
        * BDD single-N6 MUP GTP round trip with iperf3 traffic

    - note: |
        ### Build & release
        * cradle-ebpf is built with the pinned toolchain instead
          of a floating `nightly`; the nightly toolchain is pinned
          to 2026-07-23 (rustc codegen ICE broke the .deb build)
        * `Cargo.lock` is tracked so release artifacts are
          reproducible
        * Nightly release notes no longer carry the changelog
          preview

- semver: 0.9.8
  date: 2026-07-15T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### Debian packaging
        * The Debian package is now built with cargo-deb instead of
          nfpm; the workspace `Cargo.toml` is the single source of the
          package version and metadata, and the retired nfpm YAML
          manifests are gone
        * The shipped Debian changelog is generated from
          `CHANGELOG.yaml` at build time, keeping it in step with the
          version being packaged

    - note: |
        ### Release automation
        * GitHub release notes are rendered straight from
          `CHANGELOG.yaml` — nightly builds use the top entry and a
          `v<X.Y.Z>` tag uses its matching entry — with the boilerplate
          preamble dropped so the release page shows only the notes
        * The release workflow bumps `softprops/action-gh-release`
          from v2 to v3 (Node 24 runtime)

- semver: 0.9.7
  date: 2026-07-15T08:30:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### Mobile User Plane (GTP-U / MUP)
        * GTP-U G-PDU decapsulation handles the optional header
          fields (sequence number, N-PDU number, next-extension-header
          flag) and a PDU Session Container extension header
          (5G N3/N9), not just the minimal 8-byte GTP header
        * BDD MUP GTP round-trip feature: a real UE ping traverses
          the GTP tunnel, with free5GC-shaped PFCP session
          establishment

    - note: |
        ### Control plane
        * L3 port routes are re-derived when kernel interface
          addresses change, keeping the eBPF FIB in sync after an
          address add/remove

