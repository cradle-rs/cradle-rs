system:
  cradle:
    enabled: true
# pe3 — EVPN-over-MPLS PE. IS-IS L2 with SR-MPLS supplies the transport
# LSPs between the PE loopbacks; iBGP L2VPN-EVPN (`encapsulation mpls`)
# advertises the per-EVI service label (Type-3) and, for a multihomed
# segment, the per-ES ESI label (RFC 7432 §8.3, per-ES A-D). cradle is the
# L2 data plane.
interface:
- if-name: lo
  ipv4:
    address: 3.3.3.3/32
- if-name: pe3u
  ipv4:
    address: 10.0.13.2/24
router:
  isis:
    net: 49.0000.0000.0000.0003.00
    hostname: pe3
    is-type: level-2-only
    segment-routing: mpls
    te-router-id: 3.3.3.3
    interface:
    - if-name: lo
      ipv4:
        enabled: true
        prefix-sid:
          index: 3
    - if-name: pe3u
      network-type: point-to-point
      metric: 10
      ipv4:
        enabled: true
  bgp:
    global:
      as: 65000
      router-id: 3.3.3.3
    timer:
      adv-interval:
        ibgp: 1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: mpls
      evi:
      - id: 100
        bridge: br100
      vtep-source: 3.3.3.3
      ethernet-segment:
      - name: es1
        esi: "00:00:00:00:00:00:00:00:00:01"
        redundancy-mode: all-active
        interface: pe3c
    neighbor:
    - remote-address: 1.1.1.1
      remote-as: 65000
      update-source: 3.3.3.3
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
    - remote-address: 2.2.2.2
      remote-as: 65000
      update-source: 3.3.3.3
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
