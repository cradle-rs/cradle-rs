# pe1 — EVPN VPWS PE over VXLAN (RFC 8365 §6), teeing to cradle. The
# DEFAULT `encapsulation vxlan` (deliberately not spelled) and no SRv6
# locator anywhere: eline1's Type-1 carries VNI 5001 (explicit leaf) in
# its label field + the VXLAN Encapsulation EC, next hop = the router-id
# = the loopback VTEP the BGP session runs over. eline2 (VID 30, same
# AC) lets its VNI default to the EVI (200). The static /32 toward pe2's
# VTEP resolves the datapath encap via the teed FIB4.
system:
  cradle:
    enabled: true
interface:
- if-name: lo
  ipv4:
    address: 192.0.2.1/32
- if-name: pe1u
  ipv4:
    address: 10.0.12.1/24
router:
  static:
    ipv4:
      route:
      - prefix: 192.0.2.2/32
        nexthop:
        - address: 10.0.12.2
  bgp:
    global:
      as: 65001
      router-id: 192.0.2.1
    timer:
      adv-interval:
        ibgp: 1
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 102
        interface: pe1c
        vni: 5001
      # VLAN-scoped E-Line sharing the SAME AC port: only 802.1Q VID 30
      # frames enter it (demuxed at the egress from the DX2V table, VLAN
      # table = the EVI); untagged frames still ride eline1.
      - name: eline2
        evi: 200
        local-service-id: 201
        remote-service-id: 202
        interface: pe1c
        vlan: 30
    neighbor:
    - remote-address: 192.0.2.2
      remote-as: 65001
      update-source: 192.0.2.1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
