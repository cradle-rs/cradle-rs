# pe2 — the mirror of pe1. eline1 leaves the vni leaf unset, so its VNI
# defaults to the EVI (100): the two directions of eline1 deliberately
# carry DIFFERENT VNIs (pe1 advertised 5001, pe2 advertises 100) — each
# PE encapsulates with what its peer advertised, the downstream-assigned
# semantic of the Type-1 label field.
system:
  cradle:
    enabled: true
interface:
- if-name: lo
  ipv4:
    address: 192.0.2.2/32
- if-name: pe2u
  ipv4:
    address: 10.0.12.2/24
router:
  static:
    ipv4:
      route:
      - prefix: 192.0.2.1/32
        nexthop:
        - address: 10.0.12.1
  bgp:
    global:
      as: 65001
      router-id: 192.0.2.2
    timer:
      adv-interval:
        ibgp: 1
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 102
        remote-service-id: 101
        interface: pe2c
      - name: eline2
        evi: 200
        local-service-id: 202
        remote-service-id: 201
        interface: pe2c
        vlan: 30
    neighbor:
    - remote-address: 192.0.2.1
      remote-as: 65001
      update-source: 192.0.2.2
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
