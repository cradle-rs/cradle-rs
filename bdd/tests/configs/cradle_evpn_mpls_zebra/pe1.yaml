system:
  cradle:
    enabled: true
# PE1 — EVPN-over-MPLS provider edge. IS-IS L2 with SR-MPLS supplies the
# transport LSP to PE2's loopback; iBGP L2VPN-EVPN (`encapsulation mpls`)
# advertises this PE's per-EVI service label. cradle is the L2 data plane —
# the kernel has no action that pops a label into a bridge.
interface:
- if-name: lo
  ipv4:
    address: 1.1.1.1/32
- if-name: p
  ipv4:
    address: 10.250.0.1/30
router:
  isis:
    net: 49.0000.0000.0000.0001.00
    hostname: pe1
    is-type: level-2-only
    segment-routing: mpls
    te-router-id: 1.1.1.1
    interface:
    - if-name: lo
      ipv4:
        enabled: true
        prefix-sid:
          index: 1
    - if-name: p
      network-type: point-to-point
      metric: 10
      ipv4:
        enabled: true
  bgp:
    global:
      as: 65000
      router-id: 1.1.1.1
    timer:
      adv-interval:
        ibgp: 1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: mpls
      evi:
      - id: 100
        bridge: br100
    neighbor:
    - remote-address: 2.2.2.2
      remote-as: 65000
      update-source: 1.1.1.1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
