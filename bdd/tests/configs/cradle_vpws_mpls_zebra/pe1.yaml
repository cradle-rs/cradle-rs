system:
  cradle:
    enabled: true
# PE1 — EVPN VPWS over MPLS provider edge. IS-IS SR-MPLS supplies the
# transport LSP to PE2's loopback; iBGP L2VPN-EVPN (`encapsulation mpls`)
# advertises a per-service label on each vpws Type-1 (no Encapsulation
# EC — RFC 8365 §5.1.3's default). No bridge, no EVI list: eline1
# cross-connects the AC whole-port, eline2 the same AC scoped to VID 30.
# cradle is the E-Line data plane — the kernel has no pop-to-port action.
interface:
- if-name: lo
  ipv4:
    address: 1.1.1.1/32
- if-name: p
  ipv4:
    address: 10.250.0.1/30
router:
  isis:
    net: 49.0000.0000.0000.0001.00
    hostname: pe1
    is-type: level-2-only
    segment-routing: mpls
    te-router-id: 1.1.1.1
    interface:
    - if-name: lo
      ipv4:
        enabled: true
        prefix-sid:
          index: 1
    - if-name: p
      network-type: point-to-point
      metric: 10
      ipv4:
        enabled: true
  bgp:
    global:
      as: 65000
      router-id: 1.1.1.1
    timer:
      adv-interval:
        ibgp: 1
    afi-safi:
    - name: evpn
      encapsulation: mpls
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 102
        interface: pe1c
      # VLAN-scoped E-Line sharing the SAME AC port: only 802.1Q VID 30
      # frames enter it (pop-to-AC demuxed over the DX2V table = the
      # EVI); untagged frames still ride eline1.
      - name: eline2
        evi: 200
        local-service-id: 201
        remote-service-id: 202
        interface: pe1c
        vlan: 30
    neighbor:
    - remote-address: 2.2.2.2
      remote-as: 65000
      update-source: 1.1.1.1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
