system:
  cradle:
    enabled: true
vrf:
- name: N3
- name: N6
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: z1n3
  vrf: N3
  ipv4:
    address: 10.0.12.1/24
- if-name: z1n6
  vrf: N6
  ipv4:
    address: 10.0.60.1/24
router:
  bgp:
    global:
      as: 65000
      router-id: 1.1.1.1
    vrf:
    - name: N3
      rd: "65000:3"
      afi-safi:
        mup:
          dataplane: gtp
          segment:
          - type: interwork
            prefix: 10.0.12.0/24
          route:
          - type: st2
            network-instance: internet
            mup-ext-comm: "1:6"
    - name: N6
      rd: "65000:6"
      afi-safi:
        mup:
          dataplane: gtp
          segment:
          - type: direct
            mup-ext-comm: "1:6"
          route:
          - type: st1
            network-instance: internet
    mup-c:
      enabled: true
      controller-address: 2001:db8::1
      pfcp:
        listen-address: 127.0.0.1
