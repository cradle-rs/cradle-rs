# pe2 — a dynamic EVPN/VXLAN PE (zebra-rs teeing to cradle) with a leaf AC,
# pe2l, and a root AC, pe2r, in VNI 100 (both in br100): a mixed PE, so its
# IMET is not coloured. pe1's leaf-only IMET makes zebra-rs mark pe1's
# VTEP for cradle (`SetEtreeRemote`). `etree` needs zebra-rs's
# `--feature etree`.
system:
  cradle:
    enabled: true
interface:
- if-name: lo
  ipv4:
    address: 192.0.2.2/32
- if-name: pe2u
  ipv4:
    address: 10.0.12.2/24
vxlan:
- name: vxlan100
  vni: 100
  local-address: 192.0.2.2
router:
  static:
    ipv4:
      route:
      - prefix: 192.0.2.1/32
        nexthop:
        - address: 10.0.12.1
  bgp:
    global:
      as: 65001
      router-id: 10.0.0.2
    timer:
      adv-interval:
        ibgp: 1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      etree:
        leaf-interface:
        - name: pe2l
    neighbor:
    - remote-address: 192.0.2.1
      remote-as: 65001
      update-source: 192.0.2.2
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
