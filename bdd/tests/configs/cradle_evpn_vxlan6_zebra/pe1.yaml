system:
  cradle:
    enabled: true
interface:
- if-name: lo
  ipv6:
    address: 2001:db8:ff::1/128
- if-name: pe1u
  ipv6:
    address: 2001:db8:12::1/64
vxlan:
- name: vxlan100
  vni: 100
  local-address: 2001:db8:ff::1
router:
  static:
    ipv6:
      route:
      - prefix: 2001:db8:ff::2/128
        nexthop:
        - address: 2001:db8:12::2
  bgp:
    global:
      as: 65001
      router-id: 10.0.0.1
    timer:
      adv-interval:
        ibgp: 1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
    neighbor:
    - remote-address: 2001:db8:ff::2
      remote-as: 65001
      update-source: 2001:db8:ff::1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
